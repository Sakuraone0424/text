<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
    <title>出题进度</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/subpage.css" />
    <link rel="stylesheet" href="/static/progress.css" />
  </head>
  <body>
    <main class="page">
      <header class="subbar">
        <a class="back" href="/training" aria-label="返回首页"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
        <h1>出题进度</h1>
        <span></span>
      </header>
      <div id="login-slot"></div>
      <p id="notice" role="status" hidden></p>
      <div id="content" class="stack" hidden>
        <section class="card key" aria-labelledby="h-batch">
          <div class="key-head">
            <h2 id="h-batch" class="label">首批目标已入库</h2>
            <p class="rate"><span class="label">今日审核通过率</span> <b id="review-rate"></b></p>
          </div>
          <p class="big"><b id="batch-number"></b><span id="batch-target" class="unit"></span></p>
          <div id="batch-progress"></div>
          <div class="cells">
            <div><span class="label">当前时段</span><b id="period"></b></div>
            <div><span class="label">后台服务</span><b id="worker"></b></div>
            <div><span class="label">凑齐一张卷</span><b id="paper-main"></b></div>
          </div>
          <p id="paper-note" class="note"></p>
          <p id="worker-note" class="note"></p>
          <p id="admitted-today" class="note" hidden></p>
        </section>
        <section class="card" aria-labelledby="h-bank">
          <div class="card-head">
            <h2 id="h-bank">题库库存</h2>
            <div class="segmented" role="group" aria-label="科目">
              <button type="button" data-subject="biochemistry" aria-pressed="true">生化</button>
              <button type="button" data-subject="cell_biology" aria-pressed="false">细胞</button>
            </div>
          </div>
          <p class="note">已入库 / 目标</p>
          <div id="bank"></div>
          <details id="legacy" class="legacy" hidden>
            <summary id="legacy-summary"></summary>
            <ul id="legacy-list" class="legacy-list"></ul>
          </details>
        </section>
        <section class="card" aria-labelledby="h-spend">
          <div class="card-head">
            <h2 id="h-spend">本月花费</h2>
            <p class="quota"><b id="spend-month"></b></p>
          </div>
          <div id="spend-chart"></div>
          <div class="cells four">
            <div><span class="label">今日</span><b id="spend-today"></b></div>
            <div><span class="label">每入库一题</span><b id="spend-per"></b></div>
            <div><span class="label">今日剩余</span><b id="spend-daily-left"></b></div>
            <div><span class="label">本月出题剩余</span><b id="spend-left"></b></div>
          </div>
          <div class="cells" id="ledger">
            <div><span class="label">实际已花</span><b id="ledger-actual"></b></div>
            <div><span class="label">预留中</span><b id="ledger-reserved"></b></div>
            <div><span class="label">上次对账</span><b id="ledger-checked"></b></div>
          </div>
          <p id="ledger-note" class="note"></p>
          <p class="note">判分预留剩余 <span id="spend-grading"></span></p>
          <p id="spend-note" class="note"></p>
        </section>
        <section class="card" aria-labelledby="h-waste">
          <h2 id="h-waste">近 24 小时被挡原因</h2>
          <div id="waste"></div>
        </section>
        <section class="card" aria-labelledby="h-jobs">
          <h2 id="h-jobs">最近任务</h2>
          <ol id="jobs" class="jobs"></ol>
        </section>
        <p id="updated" class="note center">正在读取…</p>
      </div>
    </main>
    <script src="/static/shell.js" defer></script>
    <script src="/static/session.js" defer></script>
    <script src="/static/charts.js" defer></script>
    <script src="/static/progress.js" defer></script>
  </body>
</html>

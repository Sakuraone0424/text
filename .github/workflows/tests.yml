name: Backend acceptance
# A pull request run writes the commit it tested and the base it was tested against into its own name, so a later run can
# check (see "reuse") that a merge added nothing the run had not seen.
run-name: ${{ github.event_name == 'pull_request' && format('tests pr#{0} head={1} base={2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha) || github.event.head_commit.message || github.workflow }}
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
  actions: read          # the "reuse" job looks up earlier runs of the same commit
# A newer push to the same pull request makes the older run pointless. (Pushes to feat/** and main are never cancelled.)
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHARDS: 6

jobs:
  # Code that was already tested as a pull request is not tested again. Railway ("Wait for CI") waits for every check of a
  # commit; without this the same minutes would run again after each merge, and once more for the long-lived pull request
  # from feat/** into main, which re-runs on every push to feat/**. The commit under test is the pushed commit (push) or
  # the pull request head (pull_request). It counts as "already tested" only when it provably holds the same code as a
  # pull request run that passed:
  #   - push of a fast-forwarded branch: the pushed commit IS the head of a passed pull request run (same SHA); or
  #   - a merge commit (made by GitHub's merge button): its second parent is the head of a passed pull request run AND its
  #     first parent is the base that run was tested against, so merging added nothing the run had not seen.
  # Anything else (squash, a base that moved, a hand-made commit, an ordinary pull request head) runs the full tests.
  reuse:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.look.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          skip=false
          read -r -a commits <<< "$(git rev-list --parents -n 1 HEAD)"
          head=""; base=""
          if [ "${#commits[@]}" -eq 3 ]; then base="${commits[1]}"; head="${commits[2]}"      # a merge commit
          elif [ "${#commits[@]}" -eq 2 ] && [ "$EVENT" = "push" ]; then head="${commits[0]}"  # fast-forward
          fi
          if [ -n "$head" ]; then
            passed=$(gh api "repos/$REPO/actions/workflows/tests.yml/runs?head_sha=$head&event=pull_request&status=completed&per_page=50" 2>/dev/null \
              | jq --arg head "$head" --arg base "$base" '[.workflow_runs[] | select(.conclusion=="success")
                     | select($base == "" or (.display_title | contains("head=" + $head + " base=" + $base)))] | length' 2>/dev/null \
              || echo 0)
            [ "${passed:-0}" -gt 0 ] 2>/dev/null && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT commit=$(git rev-parse HEAD) parents=${#commits[@]} head=$head base=$base"
          echo "an identical code state already passed as a pull request: $skip"

  tests:
    name: shard ${{ matrix.shard }}
    needs: reuse
    if: needs.reuse.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        # the public.ecr.aws mirror pulls faster and is not rate limited like Docker Hub
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: quiz_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: quiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quiz_test -d quiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Playwright version (the browser cache key)
        id: pw
        run: echo "version=$(python -c 'import playwright; from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-firefox-webkit
      - name: Download the browsers (only when not cached) and install their system libraries
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install chromium firefox webkit
          fi
          python -m playwright install-deps chromium firefox webkit
      - run: sudo apt-get install -y --no-install-recommends libnss3-tools bubblewrap
      - name: Preserve QA browser protocol pipes in the mount helper
        run: |
          printf '%s\n' 'Defaults!/usr/bin/bwrap closefrom_override' | sudo tee /etc/sudoers.d/quiz-qa-bwrap-fds >/dev/null
          sudo chmod 0440 /etc/sudoers.d/quiz-qa-bwrap-fds
          sudo visudo -cf /etc/sudoers.d/quiz-qa-bwrap-fds
      - name: Make the throw-away test database fast (no fsync, it is rebuilt every run)
        working-directory: .
        run: |
          export PGPASSWORD=local-ci-only
          for setting in "fsync=off" "synchronous_commit=off" "full_page_writes=off"; do
            psql -h 127.0.0.1 -U quiz_test -d quiz_test -c "ALTER SYSTEM SET $setting"
          done
          psql -h 127.0.0.1 -U quiz_test -d quiz_test -c "SELECT pg_reload_conf()"
      - name: Tests, shard ${{ matrix.shard }} of ${{ env.SHARDS }} (split by recorded durations, so the shards take about equally long)
        run: python -m pytest -ra -q -p no:cacheprovider --splits ${{ env.SHARDS }} --group ${{ matrix.shard }} --splitting-algorithm least_duration --durations-path .test_durations --durations=15
        env:
          SHOT_DIR: ${{ github.workspace }}/screenshots
          QUIZ_QA_PRIVILEGED_MOUNTS: '1'
          TEST_DATABASE_URL: postgresql://quiz_test:local-ci-only@127.0.0.1:5432/quiz_test
      - name: Keep the page screenshots (WebKit and Chromium, Safari and home-screen modes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.shard }}
          path: screenshots/
          if-no-files-found: ignore
      - name: Remove temporary QA mount-helper policy
        if: always()
        run: sudo rm -f /etc/sudoers.d/quiz-qa-bwrap-fds

  # One required, stable check name. Railway ("Wait for CI") and any branch rule look at this single result: it passes
  # only when every shard passed, or when the exact same commit already passed as a pull request.
  test:
    name: test
    needs: [reuse, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed (or this exact commit already did)
        env:
          SKIPPED: ${{ needs.reuse.outputs.skip }}
          RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$SKIPPED" = "true" ]; then echo "same commit already passed as a pull request"; exit 0; fi
          [ "$RESULT" = "success" ] || { echo "shards: $RESULT"; exit 1; }

name: Backend acceptance
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quiz_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: quiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quiz_test -d quiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libnss3-tools bubblewrap
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Preserve QA browser protocol pipes in the mount helper
        run: |
          printf '%s\n' 'Defaults!/usr/bin/bwrap closefrom_override' | sudo tee /etc/sudoers.d/quiz-qa-bwrap-fds >/dev/null
          sudo chmod 0440 /etc/sudoers.d/quiz-qa-bwrap-fds
          sudo visudo -cf /etc/sudoers.d/quiz-qa-bwrap-fds
      - name: Preflight all three browsers over verified HTTPS
        run: python -m pytest tests/test_https_recovery.py::test_real_https_offline_refresh_and_reconnect -x -q
        env:
          QUIZ_QA_PRIVILEGED_MOUNTS: '1'
          TEST_DATABASE_URL: postgresql://quiz_test:local-ci-only@127.0.0.1:5432/quiz_test
      - run: python -m pytest -ra -q -p no:cacheprovider
        env:
          QUIZ_QA_PRIVILEGED_MOUNTS: '1'
          TEST_DATABASE_URL: postgresql://quiz_test:local-ci-only@127.0.0.1:5432/quiz_test
      - name: Remove temporary QA mount-helper policy
        if: always()
        run: sudo rm -f /etc/sudoers.d/quiz-qa-bwrap-fds
